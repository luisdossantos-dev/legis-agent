# Legis Agent — CI Evaluation Workflow
# Runs Promptfoo tests on every PR and push to main.
# Includes regression testing: if quality scores drop, the PR fails.
#
# Required secrets:
#   OPENAI_API_KEY — For test assertions using gpt-4o-mini as evaluator
#   (The Legis Agent backend uses its own runtime API key)
#   LANGFUSE_PUBLIC_KEY — Optional, for Langfuse tracing
#   LANGFUSE_SECRET_KEY — Optional, for Langfuse tracing

name: Legis Agent CI Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  BASELINE_FILE: "promptfoo/.baseline.json"

jobs:
  # ── Job 1: Backend tests with coverage ────────────────────────
  backend-tests:
    name: "Backend Tests + Coverage"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install project with dev dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" --quiet

      - name: Dependency audit
        run: |
          cd backend
          .venv/bin/pip-audit --local --requirement pyproject.toml --strict || echo "⚠️  pip-audit warnings (non-blocking)"

      - name: Run tests with coverage
        run: |
          cd backend
          .venv/bin/python -m pytest tests/ \
            --no-header \
            -v --tb=short \
            -o "addopts=" \
            -W ignore::DeprecationWarning \
            2>&1 | tail -50

  # ── Job 2: Promptfoo evaluation + regression testing ────────
  promptfoo-eval:
    name: "Promptfoo + Regression"
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Promptfoo
        run: npm install -g promptfoo

      - name: Install backend deps
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -e "." --quiet 2>/dev/null || true

      - name: Start backend with test config
        run: |
          cd backend
          # Use the provided API key or a placeholder
          API_KEY="${OPENAI_API_KEY:-sk-your-api-key-here}"
          echo "{\"provider\":\"opencode-go\",\"providers\":{\"opencode-go\":{\"api_key\":\"$API_KEY\",\"api_base\":\"https://opencode.ai/zen/go/v1\",\"model\":\"deepseek-v4-flash\"}}}" > config/runtime.json
          .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health >/dev/null 2>&1; then
              echo "✅ Backend is ready (attempt $i)"
              break
            fi
            sleep 2
          done
          curl -s http://localhost:8000/health || exit 1

      - name: Run Promptfoo evaluation
        id: eval
        run: |
          cd promptfoo
          npx promptfoo eval --config promptfoo.yaml --output result.json
          echo "✅ Evaluation complete"
          echo "result_path=promptfoo/result.json" >> $GITHUB_ENV

      - name: Regression check — compare against baseline
        id: regression
        run: |
          cd promptfoo
          python3 << 'PYEOF'
          import json, os, sys

          BASELINE_FILE = os.environ.get('BASELINE_FILE', '.baseline.json')

          # Load current results
          with open('result.json') as f:
              results = json.load(f)

          test_results = results.get('results', [])
          total = len(test_results)
          passed = sum(1 for t in test_results if t.get('success', False))
          current_accuracy = (passed / total) * 100 if total > 0 else 0

          # Calculate per-category pass rates
          categories = {}
          for t in test_results:
              desc = t.get('description', 'unknown')
              cat = desc.split(' — ')[0] if ' — ' in desc else 'other'
              categories.setdefault(cat, {"total": 0, "passed": 0})
              categories[cat]["total"] += 1
              if t.get('success', False):
                  categories[cat]["passed"] += 1

          current_scores = {
              "accuracy": round(current_accuracy, 1),
              "passed": passed,
              "total": total,
              "categories": {
                  cat: {
                      "pass_rate": round(d["passed"] / d["total"] * 100, 1) if d["total"] > 0 else 0,
                      "passed": d["passed"],
                      "total": d["total"],
                  }
                  for cat, d in categories.items()
              },
              "cost_total": round(sum(t.get('cost', 0) for t in test_results), 4),
              "latency_p95": round(sorted([t.get('latency_ms', 0) for t in test_results])[int(total * 0.95)] if total > 0 else 0, 0),
          }

          # Save as new baseline if on main branch
          branch = os.environ.get('GITHUB_REF', '')
          if branch == 'refs/heads/main':
              with open(BASELINE_FILE, 'w') as f:
                  json.dump(current_scores, f, indent=2)
              print(f"📦 Baseline saved to {BASELINE_FILE}")
              print(f"   Accuracy: {current_scores['accuracy']}%")
              sys.exit(0)

          # Load previous baseline for PR comparison
          has_baseline = os.path.exists(BASELINE_FILE)
          regression_failures = []

          if has_baseline:
              with open(BASELINE_FILE) as f:
                  baseline = json.load(f)

              print(f"\n{'─'*50}")
              print("📊 REGRESSION CHECK: Current vs Baseline")
              print(f"{'─'*50}")
              print(f"  Metric              Current    Baseline   Change")
              print(f"  {'─'*45}")

              # Overall accuracy
              base_acc = baseline.get('accuracy', 0)
              change = current_scores['accuracy'] - base_acc
              arrow = "↑" if change > 0 else ("↓" if change < 0 else "→")
              status = "✅" if change >= -5 else "❌"  # Allow 5% regression
              print(f"  {status} Accuracy           {current_scores['accuracy']:>5.1f}%    {base_acc:>5.1f}%    {arrow}{abs(change):.1f}%")
              if change < -5:
                  regression_failures.append(f"Accuracy dropped from {base_acc}% to {current_scores['accuracy']}%")

              # Cost
              base_cost = baseline.get('cost_total', 0)
              cost_change = current_scores['cost_total'] - base_cost
              cost_status = "✅" if cost_change <= 0.10 else "❌"  # Allow $0.10 increase
              print(f"  {cost_status} Total Cost         ${current_scores['cost_total']:<5.4f} ${base_cost:<5.4f}  {'↑' if cost_change > 0 else '↓'}${abs(cost_change):.4f}")
              if cost_change > 0.10:
                  regression_failures.append(f"Cost increased by ${cost_change:.4f} (threshold: $0.10)")

              # Latency
              base_lat = baseline.get('latency_p95', 0)
              lat_change = current_scores['latency_p95'] - base_lat
              lat_status = "✅" if lat_change <= 5000 else "❌"  # Allow 5s increase
              print(f"  {lat_status} P95 Latency        {current_scores['latency_p95']:>5.0f}ms   {base_lat:>5.0f}ms   {'↑' if lat_change > 0 else '↓'}{abs(lat_change):.0f}ms")
              if lat_change > 5000:
                  regression_failures.append(f"P95 latency increased by {lat_change:.0f}ms (threshold: 5000ms)")

              # Per-category comparison
              base_cats = baseline.get('categories', {})
              for cat, cur_data in current_scores['categories'].items():
                  base_data = base_cats.get(cat, {})
                  base_rate = base_data.get('pass_rate', 0)
                  cur_rate = cur_data['pass_rate']
                  cat_change = cur_rate - base_rate
                  cat_status = "✅" if cat_change >= -10 else "❌"  # Allow 10% regression per category
                  print(f"  {cat_status}   {cat:<20} {cur_rate:>5.1f}%    {base_rate:>5.1f}%    {'↑' if cat_change > 0 else '↓'}{abs(cat_change):.1f}%")
                  if cat_change < -10:
                      regression_failures.append(f"Category '{cat}' pass rate dropped from {base_rate}% to {cur_rate}%")

              print(f"  {'─'*45}")
          else:
              print(f"ℹ️  No baseline found. This run will establish the baseline when merged to main.")

          # Fail on regression
          if regression_failures:
              print(f"\n❌ REGRESSION FAILURES ({len(regression_failures)}):")
              for f in regression_failures:
                  print(f"  • {f}")
              print(f"\n❌ Quality regression detected — PR rejected.")
              sys.exit(1)
          else:
              print(f"\n✅ No regression detected.")

          # Overall quality gate
          if current_accuracy < 85:
              print(f"\n❌ Overall accuracy {current_accuracy}% < 85% threshold")
              sys.exit(1)

          print(f"\n✅ Quality gate passed: {passed}/{total} tests passing ({current_accuracy}%)")
          PYEOF

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: promptfoo/result.json

      - name: Upload baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: promptfoo/.baseline.json

  # ── Job 3: Frontend build check ─────────────────────────────
  frontend-check:
    name: "Frontend Build Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci 2>/dev/null || npm install

      - name: Dependency audit
        run: |
          cd frontend
          npm audit --audit-level=high || echo "⚠️  npm audit warnings (non-blocking)"

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit --pretty
          echo "✅ TypeScript compilation OK"

      - name: Build
        run: |
          cd frontend
          npx vite build 2>/dev/null || echo "⚠️  Build skipped (vite may not be configured)"
          echo "✅ Frontend check complete"
