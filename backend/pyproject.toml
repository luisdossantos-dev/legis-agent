[project]
name = "legis-agent"
version = "0.1.0"
description = "AI Agent system for legal document analysis and drafting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.50",
    "langgraph>=0.2",
    "langfuse>=2.50",
    "openai>=1.0",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "dspy-ai>=2.6",
    "llama-index>=0.12",
    "slowapi>=0.1.9",
    "prometheus-client>=0.21",
    "rank-bm25>=0.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]
pinecone = ["pinecone>=5.0"]
pgvector = ["psycopg2-binary>=2.9", "sqlalchemy>=2.0"]
all = ["legis-agent[pinecone,pgvector,rerank]"]
rerank = ["torch>=2.0", "transformers>=4.30"]
embed = ["fastembed>=0.4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.setuptools.packages.find]
include = ["app*", "app.*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:coverage.xml",
    "--no-cov-on-fail",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/_static/*",
    "*/conftest.py",
]

[tool.coverage.report]
# Show lines with missing coverage
show_missing = true
skip_covered = true
# Fail if total coverage < 80%
fail_under = 80
# Exclude common non-production patterns
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
